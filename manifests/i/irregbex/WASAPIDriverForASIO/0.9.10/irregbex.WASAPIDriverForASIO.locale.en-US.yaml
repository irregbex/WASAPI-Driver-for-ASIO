ShortDescription: Free ASIO driver that plays and records through any Windows audio device (WASAPI).
Description: |-
  ASIO driver for Windows that uses WASAPI (Shared or Exclusive mode), so any Windows audio device, including
  Bluetooth headphones and built-in sound, can be used by ASIO programs. Includes a control panel, a monitor
