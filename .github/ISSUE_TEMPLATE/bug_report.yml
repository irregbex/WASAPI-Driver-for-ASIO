# WASAPI Driver for ASIO - issue form: problem report (0.8.0, G7)
# SPDX-License-Identifier: GPL-3.0-or-later
name: Problem report
description: Something does not work (no sound, dropouts, crash, a DAW cannot open the driver, ...)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please do not include personal data: the diagnostics report and "Copy status"
        already replace user folders, the user name and the computer name, but check before posting.
        Security problems: please follow SECURITY.txt instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Driver version
      description: Control panel > About, or the first line of "Copy status".
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Program (DAW or other ASIO host) and its version
      placeholder: "e.g. a DAW name and version"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Shared
        - Shared low latency
        - Exclusive
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Output device type
      options:
        - USB audio interface
        - Built-in sound
        - Bluetooth headphones / speaker
        - HDMI / DisplayPort
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status text
      description: Control panel > Status > "Copy status" (or tray icon menu > Copy status), pasted here.
      render: text
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics report (optional)
      description: Start menu > WASAPI Driver for ASIO > Diagnostics, then attach or paste the report.
      render: text
  - type: textarea
    id: trace
    attributes:
      label: Trace (optional, 0.9.8 and later)
      description: >-
        For dropouts, resets or hangs: Start menu > WASAPI Driver for ASIO > Start trace, reproduce the problem,
        Stop trace, then zip the .etl file from your Desktop and drag it here. See TRACING.txt (what it contains).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that the text above contains no personal data I do not want to publish.
          required: true
