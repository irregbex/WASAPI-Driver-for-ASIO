# WASAPI Driver for ASIO - automatic build (3 DLLs, tools and installer; 0.9.9: Arm64X DLL with MSVC)
# SPDX-License-Identifier: GPL-3.0-or-later
# 0.9.10: actions moved to releases that run on Node.js 24 (GitHub deprecates Node 20 for actions): checkout v7.0.1,
# upload-artifact v7.0.2, download-artifact v8.0.2 (each action.yml says "using: node24"). Behaviour kept: uploads are
# still zipped (archive: true is the default) and hidden files still excluded (as since v4.4); a download by name
# still extracts into `path`, and a download of all artifacts (release job) still creates one sub-folder per
# artifact (merge-multiple: false). One deliberate difference: download-artifact v8 fails on a digest mismatch
# (digest-mismatch: error, the default) where v4 only logged it, so a corrupted artifact can no longer be packaged.
# ilammy/msvc-dev-cmd stays at v1.13.0: it is the latest release and still "using: node20" (no Node 24 release
# exists); the runner runs it with Node 24 once GitHub forces that. Linux jobs run on ubuntu-24.04 (named, instead
# of ubuntu-latest, so a future image change is a deliberate edit and the migration notice no longer appears).
name: build

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 0.9.9: runs after "arm64x" so the installer artifact contains the Arm64X DLL whenever that job produced a
    # verified one (output ok == 'true', see scripts/build-arm64x.ps1). "arm64x" is experimental: its failure
    # never stops this job (!cancelled() instead of the implicit success()); the installer is then built without
    # the Arm64X DLL, exactly as before 0.9.9.
    needs: arm64x
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Arm64X DLL from the arm64x job (only when it passed every check)
        if: ${{ needs.arm64x.outputs.ok == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arm64x
          path: arm64x
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 nsis
          # win32 thread model of mingw (the Ubuntu default), same as the local build
          # same Zig version as the local build (0.16.0)
          python3 -m pip install --user ziglang==0.16.0 || python3 -m pip install --user --break-system-packages ziglang==0.16.0

      - name: Build
        run: |
          sh build.sh
          sh build-x86.sh
          sh build-arm64.sh
          sh build-diag.sh
          sh build-test.sh

      - name: Offline tests (all 18, including the 0.9.8 fuzz / ASIO argument validation / trace encoder tests under sanitizers)
        run: sh tests/run_all.sh

      - name: Installer
        run: |
          # src/common.h has CRLF line endings: take only the text between the quotes, never the trailing CR (0.9.7)
          VERSION=$(sed -n 's/^#define WB_VERSION_STR "\([^"]*\)".*/\1/p' src/common.h)
          mkdir -p stage/installer
          cp WasapiDriver64.dll WasapiDriver32.dll WasapiDriverARM64.dll WasapiDriverDiag.exe WasapiDriverTest.exe LICENSE.txt stage/
          # documents: pkg2/ in the development tree, the repository root in the published source tree
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          for f in README QUICK-START FAQ COMPATIBILITY TEST-GUIDE COPYRIGHT THIRD-PARTY-NOTICES TRADEMARKS DISCLAIMER PRIVACY SECURITY CONTRIBUTING TRACING; do cp $DOC/$f.txt stage/; done
          mkdir -p stage/trace && cp trace/WasapiDriver.wprp "trace/Start trace.bat" "trace/Stop trace.bat" stage/trace/   # 0.9.8
          cp installer/WasapiDriver.nsi installer/NOTICES.txt installer/lang_en.nsh installer/lang_es.nsh installer/header.bmp installer/welcome.bmp src/res/app.ico stage/installer/
          # 0.9.9: the Arm64X DLL goes into the Setup only if the downloaded file is the one the arm64x job checked
          # (same SHA-256); makensis then gets -DARM64X=1 (Windows on Arm: one registration for ARM64 and x64 hosts).
          ARM64X=
          if [ -f arm64x/WasapiDriverARM64X.dll ] && echo "${{ needs.arm64x.outputs.sha256 }}  arm64x/WasapiDriverARM64X.dll" | sha256sum -c -; then
            cp arm64x/WasapiDriverARM64X.dll stage/ && ARM64X=-DARM64X=1
          else
            echo "::warning title=No Arm64X DLL::The installer is built without WasapiDriverARM64X.dll (arm64x job failed or its file did not verify)"
          fi
          cd stage/installer && makensis -DVERSION=$VERSION $ARM64X WasapiDriver.nsi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WASAPI-Driver-for-ASIO
          path: |
            WasapiDriver64.dll
            WasapiDriver32.dll
            WasapiDriverARM64.dll
            WasapiDriverDiag.exe
            WasapiDriverTest.exe
            stage/WasapiDriverARM64X.dll
            stage/*-Setup.exe

  arm64x:
    # 0.9.9: Arm64X driver DLL (native ARM64 + ARM64EC in one file) built with MSVC on a Windows 11 ARM64 runner
    # at every push, so MSVC compile errors show up on the public run page (annotations; the final ::notice gives
    # the result, the dumpbin machine line, exports, imported DLLs and the SHA-256).
    # Experimental until it has passed on real hardware: it never makes the workflow fail. The outputs ok and
    # sha256 are set only when the DLL passed every check of the script; "build" packages it only then.
    runs-on: windows-11-arm
    continue-on-error: true
    outputs:
      ok: ${{ steps.arm64x.outputs.ok }}
      sha256: ${{ steps.arm64x.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Build ARM64X DLL
        id: arm64x
        shell: pwsh
        run: ./scripts/build-arm64x.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arm64x
          path: WasapiDriverARM64X.dll
          if-no-files-found: ignore
