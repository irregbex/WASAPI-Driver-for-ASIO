# WASAPI Driver for ASIO - release workflow (0.8.0, G7/G8/G9). See RELEASING.txt and SIGNING.txt.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Trigger: pushing a tag v<version> (for example v0.8.0) whose version matches WB_VERSION_STR in src/common.h, or
# a manual run (workflow_dispatch: builds and uploads the files as workflow artifacts, no GitHub Release).
#
# Jobs
#   tests          0.9.8: Ubuntu, every offline test (tests/run_all.sh: the 15 unit tests plus the fuzz, host
#                  argument validation and trace encoder tests under AddressSanitizer / UndefinedBehaviorSanitizer).
#                  Every other job needs it: nothing is built, signed or published unless ALL tests passed.
#   build          Ubuntu: the same cross build as build.yml (x64, x86, ARM64 DLLs, diagnostics, test host), all
#                  offline tests, optional signing (scripts/sign.sh: PFX + osslsigncode; does nothing without a
#                  certificate), Setup (NSIS; Setup and uninstaller signed through !finalize / !uninstfinalize),
#                  binaries zip and source zip.
#   arm64x         Experimental, Windows 11 ARM64 runner with MSVC: one ARM64X DLL (native ARM64 + ARM64EC code
#                  in one file, loadable by native ARM64 and by emulated x64 hosts). It cannot be produced by the
#                  Linux toolchains (no ARM64EC code generation, see ARCHITECTURE.txt "ARM64X"). continue-on-error:
#                  a failure here never blocks a release; the file is published as a separate, UNSIGNED download
#                  (0.9.1, fix 11: artifacts of continue-on-error jobs are never signed).
#   package-trusted  Only when the repository variable WB_SIGNING is "trusted": rebuilds the Setup on Windows
#                  and signs everything with Azure Trusted Signing (signtool + dlib). Replaces the files of "build".
#   release        Tag runs only: SHA256SUMS.txt and a DRAFT GitHub Release with all files. A maintainer reviews the
#                  draft and publishes it by hand.
#
# Third-party actions are pinned to full commit SHAs (0.9.1, fix 11; the tag is noted after each pin). To update a
# pin: git ls-remote --tags https://github.com/<owner>/<action> and take the commit of the wanted tag (the
# "^{}" line for annotated tags). See RELEASING.txt.
#
# Secrets and variables (all optional; names only, no values in this file):
#   secrets.WB_SIGN_PFX_BASE64, secrets.WB_SIGN_PFX_PASSWORD, vars.WB_SIGN_TIMESTAMP, vars.WB_SIGN_URL  (PFX)
#   vars.WB_SIGNING = trusted, secrets.AZURE_TENANT_ID, secrets.AZURE_CLIENT_ID, secrets.AZURE_CLIENT_SECRET,
#   vars.WB_TS_ENDPOINT, vars.WB_TS_ACCOUNT, vars.WB_TS_PROFILE                                     (Trusted Signing)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # 0.9.8: the release gate. A failing test stops the whole workflow before any binary is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: All offline tests (unit, fuzz, ASIO argument validation, trace encoder; sanitizers)
        run: sh tests/run_all.sh

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        id: ver
        run: |
          # src/common.h has CRLF line endings: take only the text between the quotes, never the trailing CR (0.9.7)
          VERSION=$(sed -n 's/^#define WB_VERSION_STR "\([^"]*\)".*/\1/p' src/common.h)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match WB_VERSION_STR $VERSION" >&2; exit 1
          fi
          # 0.9.7: a tagged release must name the real GitHub account. The prepared source tree carries an owner
          # token (written here in two parts so the owner-substitution step does not rewrite this check) in
          # src/common.h (update source), the documents and manifests/; see RELEASING.txt step 0.
          TOKEN="GHUSER_""PLACEHOLDER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && grep -rlI "$TOKEN" --exclude-dir=.git . ; then
            echo "The files above still contain the owner token; run the owner substitution first (RELEASING.txt)" >&2; exit 1
          fi

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 nsis osslsigncode zip
          python3 -m pip install --user ziglang==0.16.0 || python3 -m pip install --user --break-system-packages ziglang==0.16.0

      - name: Build
        run: |
          sh build.sh
          sh build-x86.sh
          sh build-arm64.sh
          sh build-diag.sh
          sh build-test.sh

      - name: Offline tests (again, on the exact tree that is packaged)
        run: sh tests/run_all.sh

      - name: Sign binaries (no-op without a certificate)
        env:
          WB_SIGN_PFX_BASE64: ${{ secrets.WB_SIGN_PFX_BASE64 }}
          WB_SIGN_PFX_PASSWORD: ${{ secrets.WB_SIGN_PFX_PASSWORD }}
          WB_SIGN_TIMESTAMP: ${{ vars.WB_SIGN_TIMESTAMP }}
          WB_SIGN_URL: ${{ vars.WB_SIGN_URL }}
        run: sh scripts/sign.sh WasapiDriver64.dll WasapiDriver32.dll WasapiDriverARM64.dll WasapiDriverDiag.exe WasapiDriverTest.exe

      - name: Setup (signed through !finalize / !uninstfinalize when a certificate is configured)
        env:
          WB_SIGN_PFX_BASE64: ${{ secrets.WB_SIGN_PFX_BASE64 }}
          WB_SIGN_PFX_PASSWORD: ${{ secrets.WB_SIGN_PFX_PASSWORD }}
          WB_SIGN_TIMESTAMP: ${{ vars.WB_SIGN_TIMESTAMP }}
          WB_SIGN_URL: ${{ vars.WB_SIGN_URL }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mkdir -p stage/installer
          cp WasapiDriver64.dll WasapiDriver32.dll WasapiDriverARM64.dll WasapiDriverDiag.exe WasapiDriverTest.exe LICENSE.txt stage/
          # documents: pkg2/ in the development tree, the repository root in the published source tree
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          for f in README QUICK-START FAQ COMPATIBILITY TEST-GUIDE COPYRIGHT THIRD-PARTY-NOTICES TRADEMARKS DISCLAIMER PRIVACY SECURITY CONTRIBUTING TRACING; do cp $DOC/$f.txt stage/; done
          # 0.9.8: tracing kit (Windows Performance Recorder profile and the two helpers)
          mkdir -p stage/trace && cp trace/WasapiDriver.wprp "trace/Start trace.bat" "trace/Stop trace.bat" stage/trace/
          cp installer/WasapiDriver.nsi installer/NOTICES.txt installer/lang_en.nsh installer/lang_es.nsh installer/header.bmp installer/welcome.bmp src/res/app.ico stage/installer/
          cd stage/installer && makensis -DVERSION=$VERSION "-DSIGN_CMD=sh $GITHUB_WORKSPACE/scripts/sign.sh" WasapiDriver.nsi

      - name: Zips (binaries + documentation, and the source tree)
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mkdir -p dist
          mv stage/WASAPI-Driver-for-ASIO-$VERSION-Setup.exe dist/
          cd stage && zip -9 -X ../dist/WASAPI-Driver-for-ASIO-$VERSION-bin.zip *.dll *.exe *.txt trace/* && cd ..
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          zip -9 -X -j dist/WASAPI-Driver-for-ASIO-$VERSION-bin.zip $DOC/install.bat $DOC/uninstall.bat $DOC/VERSION.txt $DOC/ROADMAP.txt
          git archive --format=zip --prefix=WASAPI-Driver-for-ASIO-$VERSION/ -o dist/WASAPI-Driver-for-ASIO-$VERSION-src.zip HEAD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/*

  arm64x:
    needs: tests            # 0.9.8: built only after every offline test passed
    # Experimental (G9). GitHub-hosted Windows 11 ARM64 runner; MSVC from the image (Visual Studio Build Tools
    # with the ARM64 / ARM64EC compilers). Two compilations of the same sources (native ARM64 and ARM64EC) linked
    # with /machine:arm64x into one DLL with the same exports for both halves.
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Build ARM64X DLL
        shell: cmd
        run: |
          mkdir obj\a64 obj\ec
          rc /nologo /i src /fo obj\res.res src\WasapiDriver.rc || exit /b 1
          set CF=/nologo /c /O2 /EHsc /std:c++17 /W3 /MT /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /D_CRT_SECURE_NO_WARNINGS /utf-8 /Ithird_party\asiosdk
          set SRC=src\dll.cpp src\driver.cpp src\config.cpp src\panel.cpp src\crash.cpp src\update.cpp src\trace.cpp
          cl %CF% /Foobj\a64\ %SRC% || exit /b 1
          cl %CF% /arm64EC /Foobj\ec\ %SRC% || exit /b 1
          link /nologo /dll /machine:arm64x /defArm64Native:src\WasapiBridge.def /def:src\WasapiBridge.def /out:WasapiDriverARM64X.dll obj\a64\*.obj obj\ec\*.obj obj\res.res ole32.lib uuid.lib avrt.lib winmm.lib shell32.lib user32.lib advapi32.lib gdi32.lib || exit /b 1
          dumpbin /headers WasapiDriverARM64X.dll | findstr /i "machine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64x
          path: WasapiDriverARM64X.dll

  package-trusted:
    # Azure Trusted Signing (G8). Runs only when the repository variable WB_SIGNING is "trusted". Signs the
    # binaries built by "build" with signtool + the Trusted Signing dlib, then rebuilds the Setup with NSIS on
    # Windows so that the uninstaller is signed too (!uninstfinalize) and signs the Setup (!finalize).
    needs: build
    if: vars.WB_SIGNING == 'trusted'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - name: Tools (NSIS, Trusted Signing client)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          nuget install Microsoft.Trusted.Signing.Client -x -OutputDirectory tsc
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($st.FullName)" | Out-File -Append $env:GITHUB_ENV
          "DLIB=$((Resolve-Path tsc\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll).Path)" | Out-File -Append $env:GITHUB_ENV
          @{ Endpoint = '${{ vars.WB_TS_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.WB_TS_ACCOUNT }}'; CertificateProfileName = '${{ vars.WB_TS_PROFILE }}' } | ConvertTo-Json | Out-File -Encoding ascii metadata.json
      - name: Sign binaries and rebuild the Setup
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $v = '${{ needs.build.outputs.version }}'
          New-Item -ItemType Directory stage, stage\installer | Out-Null
          Expand-Archive dist\WASAPI-Driver-for-ASIO-$v-bin.zip -DestinationPath stage
          $sign = "`"$env:SIGNTOOL`" sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$env:DLIB`" /dmdf `"$PWD\metadata.json`""
          Get-ChildItem stage\*.dll, stage\*.exe | ForEach-Object { & cmd /c "$sign `"$($_.FullName)`"" ; if ($LASTEXITCODE) { exit 1 } }
          # 0.9.8: the tracing kit and its guide are in the bin zip (trace\, TRACING.txt); the Setup takes them from there
          Copy-Item installer\WasapiDriver.nsi, installer\NOTICES.txt, installer\lang_en.nsh, installer\lang_es.nsh, installer\header.bmp, installer\welcome.bmp, src\res\app.ico stage\installer\
          Push-Location stage\installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "-DVERSION=$v" "-DSIGN_CMD=$sign" WasapiDriver.nsi
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          Move-Item -Force stage\WASAPI-Driver-for-ASIO-$v-Setup.exe dist\
          Remove-Item dist\WASAPI-Driver-for-ASIO-$v-bin.zip
          Push-Location stage; Compress-Archive -Path *.dll, *.exe, *.txt, *.bat, trace -DestinationPath ..\dist\WASAPI-Driver-for-ASIO-$v-bin.zip; Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files-trusted
          path: dist/*

  release:
    needs: [tests, build, arm64x, package-trusted]
    # Runs for tags when "build" succeeded; "arm64x" (experimental) and "package-trusted" (optional) may be
    # failed or skipped.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.tests.result == 'success' && needs.build.result == 'success' && needs.package-trusted.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Collect files and checksums (no signing secrets in this job)
        run: |
          VERSION=${{ needs.build.outputs.version }}
          mkdir -p out
          if [ -d artifacts/release-files-trusted ]; then cp artifacts/release-files-trusted/* out/; else cp artifacts/release-files/* out/; fi
          # 0.9.1 (fix 11): the ARM64X DLL comes from a continue-on-error job and is NEVER signed: it is published
          # as an unsigned experimental download, clearly named, and is not part of the Setup.
          if [ -f artifacts/arm64x/WasapiDriverARM64X.dll ]; then
            cp artifacts/arm64x/WasapiDriverARM64X.dll out/WasapiDriverARM64X-$VERSION-experimental-unsigned.dll
          fi
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.build.outputs.version }}
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          sed -n "/^$VERSION /,/^[0-9]\+\.[0-9]\+\.[0-9]\+ /p" $DOC/VERSION.txt | sed '$d' > notes.txt || true
          [ -s notes.txt ] || echo "WASAPI Driver for ASIO $VERSION. See VERSION.txt." > notes.txt
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "WASAPI Driver for ASIO $VERSION" --notes-file notes.txt
