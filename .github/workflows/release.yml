# WASAPI Driver for ASIO - release workflow (0.8.0, G7/G8/G9). See RELEASING.txt and SIGNING.txt.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Trigger: pushing a tag v<version> (for example v0.8.0) whose version matches WB_VERSION_STR in src/common.h, or
# a manual run (workflow_dispatch: builds and uploads the files as workflow artifacts, no GitHub Release).
#
# Jobs
#   tests          0.9.8: Ubuntu, every offline test (tests/run_all.sh: the 15 unit tests plus the fuzz, host
#                  argument validation and trace encoder tests under AddressSanitizer / UndefinedBehaviorSanitizer).
#                  Every other job needs it: nothing is built, signed or published unless ALL tests passed.
#   arm64x         Windows 11 ARM64 runner with MSVC: one Arm64X DLL (native ARM64 + ARM64EC code in one file,
#                  loadable by native ARM64 and by emulated x64 hosts). It cannot be produced by the Linux
#                  toolchains (no ARM64EC code generation, see ARCHITECTURE.txt section 59). scripts/build-arm64x.ps1
#                  checks the image with dumpbin (ARM64X machine, the four exports, no Visual C++ runtime DLL) and
#                  sets the job outputs ok / sha256 only when every check passed. continue-on-error: a failure
#                  here never blocks a release.
#   build          Ubuntu, after tests and arm64x: the same cross build as build.yml (x64, x86, ARM64 DLLs,
#                  diagnostics, test host), all offline tests, optional signing (scripts/sign.sh: PFX +
#                  osslsigncode; does nothing without a certificate), Setup (NSIS; Setup and uninstaller signed
#                  through !finalize / !uninstfinalize), binaries zip and source zip. 0.9.9: when arm64x passed,
#                  its DLL (checked against the SHA-256 the arm64x job reported) is signed like the other DLLs and
#                  goes INTO the Setup (makensis -DARM64X=1) and the binaries zip; otherwise both are built as
#                  before 0.9.9 and a warning annotation says so. The separate
#                  "WasapiDriverARM64X-<version>-experimental-unsigned.dll" download of 0.8.0 - 0.9.8 is gone.
#   package-trusted  Only when the repository variable WB_SIGNING is "trusted": rebuilds the Setup on Windows
#                  and signs everything with Azure Trusted Signing (signtool + dlib). Replaces the files of "build".
#   release        Tag runs only: SHA256SUMS.txt and a DRAFT GitHub Release with all files. A maintainer reviews the
#                  draft and publishes it by hand.
#
# Third-party actions are pinned to full commit SHAs (0.9.1, fix 11; the tag is noted after each pin). To update a
# pin: git ls-remote --tags https://github.com/<owner>/<action> and take the commit of the wanted tag (the
# "^{}" line for annotated tags). See RELEASING.txt.
#
# 0.9.10: actions moved to releases that run on Node.js 24 (GitHub deprecates Node 20 for actions): checkout v7.0.1,
# upload-artifact v7.0.2, download-artifact v8.0.2 (each action.yml says "using: node24"). Behaviour kept: uploads are
# still zipped (archive: true is the default) and hidden files still excluded (as since v4.4); a download by name
# still extracts into `path`, and a download of all artifacts (release job) still creates one sub-folder per
# artifact (merge-multiple: false). One deliberate difference: download-artifact v8 fails on a digest mismatch
# (digest-mismatch: error, the default) where v4 only logged it, so a corrupted artifact can no longer be packaged.
# ilammy/msvc-dev-cmd stays at v1.13.0: it is the latest release and still "using: node20" (no Node 24 release
# exists); the runner runs it with Node 24 once GitHub forces that. Linux jobs run on ubuntu-24.04 (named, instead
# of ubuntu-latest, so a future image change is a deliberate edit and the migration notice no longer appears).
#
# Secrets and variables (all optional; names only, no values in this file):
#   secrets.WB_SIGN_PFX_BASE64, secrets.WB_SIGN_PFX_PASSWORD, vars.WB_SIGN_TIMESTAMP, vars.WB_SIGN_URL  (PFX)
#   vars.WB_SIGNING = trusted, secrets.AZURE_TENANT_ID, secrets.AZURE_CLIENT_ID, secrets.AZURE_CLIENT_SECRET,
#   vars.WB_TS_ENDPOINT, vars.WB_TS_ACCOUNT, vars.WB_TS_PROFILE                                     (Trusted Signing)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # 0.9.8: the release gate. A failing test stops the whole workflow before any binary is built.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All offline tests (unit, fuzz, ASIO argument validation, trace encoder; sanitizers)
        run: sh tests/run_all.sh

  build:
    # 0.9.9: after arm64x, so the Setup and the bin zip can contain the Arm64X DLL. Runs whatever arm64x did
    # (failed, skipped), but only when every offline test passed. !cancelled() rather than always(): a cancelled
    # run builds nothing.
    needs: [tests, arm64x]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      arm64x: ${{ steps.a64x.outputs.included }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Arm64X DLL from the arm64x job (only when it passed every check)
        if: ${{ needs.arm64x.outputs.ok == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arm64x
          path: arm64x
      - name: Version
        id: ver
        run: |
          # src/common.h has CRLF line endings: take only the text between the quotes, never the trailing CR (0.9.7)
          VERSION=$(sed -n 's/^#define WB_VERSION_STR "\([^"]*\)".*/\1/p' src/common.h)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match WB_VERSION_STR $VERSION" >&2; exit 1
          fi
          # 0.9.7: a tagged release must name the real GitHub account. The prepared source tree carries an owner
          # token (written here in two parts so the owner-substitution step does not rewrite this check) in
          # src/common.h (update source), the documents and manifests/; see RELEASING.txt step 0.
          TOKEN="GHUSER_""PLACEHOLDER"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && grep -rlI "$TOKEN" --exclude-dir=.git . ; then
            echo "The files above still contain the owner token; run the owner substitution first (RELEASING.txt)" >&2; exit 1
          fi

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 nsis osslsigncode zip
          python3 -m pip install --user ziglang==0.16.0 || python3 -m pip install --user --break-system-packages ziglang==0.16.0

      - name: Build
        run: |
          sh build.sh
          sh build-x86.sh
          sh build-arm64.sh
          sh build-diag.sh
          sh build-test.sh

      - name: Offline tests (again, on the exact tree that is packaged)
        run: sh tests/run_all.sh

      - name: Arm64X DLL into the package (0.9.9)
        id: a64x
        run: |
          # Only the file the arm64x job checked (same SHA-256). It is copied next to the other DLLs, so the signing
          # step, the Setup (-DARM64X=1 below) and the bin zip (*.dll) all take it.
          if [ -f arm64x/WasapiDriverARM64X.dll ] && echo "${{ needs.arm64x.outputs.sha256 }}  arm64x/WasapiDriverARM64X.dll" | sha256sum -c -; then
            cp arm64x/WasapiDriverARM64X.dll .
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "included=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Arm64X DLL::This package is built without WasapiDriverARM64X.dll (arm64x job failed or its file did not verify); Windows on Arm keeps the ARM64 / x64 choice"
          fi

      - name: Sign binaries (no-op without a certificate)
        env:
          WB_SIGN_PFX_BASE64: ${{ secrets.WB_SIGN_PFX_BASE64 }}
          WB_SIGN_PFX_PASSWORD: ${{ secrets.WB_SIGN_PFX_PASSWORD }}
          WB_SIGN_TIMESTAMP: ${{ vars.WB_SIGN_TIMESTAMP }}
          WB_SIGN_URL: ${{ vars.WB_SIGN_URL }}
        run: |
          # 0.9.9: the Arm64X DLL is part of the package now and is signed like every other DLL (when present).
          A64X=; [ -f WasapiDriverARM64X.dll ] && A64X=WasapiDriverARM64X.dll
          sh scripts/sign.sh WasapiDriver64.dll WasapiDriver32.dll WasapiDriverARM64.dll $A64X WasapiDriverDiag.exe WasapiDriverTest.exe

      - name: Setup (signed through !finalize / !uninstfinalize when a certificate is configured)
        env:
          WB_SIGN_PFX_BASE64: ${{ secrets.WB_SIGN_PFX_BASE64 }}
          WB_SIGN_PFX_PASSWORD: ${{ secrets.WB_SIGN_PFX_PASSWORD }}
          WB_SIGN_TIMESTAMP: ${{ vars.WB_SIGN_TIMESTAMP }}
          WB_SIGN_URL: ${{ vars.WB_SIGN_URL }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mkdir -p stage/installer
          cp WasapiDriver64.dll WasapiDriver32.dll WasapiDriverARM64.dll WasapiDriverDiag.exe WasapiDriverTest.exe LICENSE.txt stage/
          # 0.9.9: Arm64X DLL (step "Arm64X DLL into the package"); the Setup registers it on Windows on Arm
          ARM64X=; [ -f WasapiDriverARM64X.dll ] && cp WasapiDriverARM64X.dll stage/ && ARM64X=-DARM64X=1
          # documents: pkg2/ in the development tree, the repository root in the published source tree
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          for f in README QUICK-START FAQ COMPATIBILITY TEST-GUIDE COPYRIGHT THIRD-PARTY-NOTICES TRADEMARKS DISCLAIMER PRIVACY SECURITY CONTRIBUTING TRACING; do cp $DOC/$f.txt stage/; done
          # 0.9.8: tracing kit (Windows Performance Recorder profile and the two helpers)
          mkdir -p stage/trace && cp trace/WasapiDriver.wprp "trace/Start trace.bat" "trace/Stop trace.bat" stage/trace/
          cp installer/WasapiDriver.nsi installer/NOTICES.txt installer/lang_en.nsh installer/lang_es.nsh installer/header.bmp installer/welcome.bmp src/res/app.ico stage/installer/
          cd stage/installer && makensis -DVERSION=$VERSION $ARM64X "-DSIGN_CMD=sh $GITHUB_WORKSPACE/scripts/sign.sh" WasapiDriver.nsi

      - name: Zips (binaries + documentation, and the source tree)
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mkdir -p dist
          mv stage/WASAPI-Driver-for-ASIO-$VERSION-Setup.exe dist/
          cd stage && zip -9 -X ../dist/WASAPI-Driver-for-ASIO-$VERSION-bin.zip *.dll *.exe *.txt trace/* && cd ..
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          zip -9 -X -j dist/WASAPI-Driver-for-ASIO-$VERSION-bin.zip $DOC/install.bat $DOC/uninstall.bat $DOC/VERSION.txt $DOC/ROADMAP.txt
          git archive --format=zip --prefix=WASAPI-Driver-for-ASIO-$VERSION/ -o dist/WASAPI-Driver-for-ASIO-$VERSION-src.zip HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*

  arm64x:
    needs: tests            # 0.9.8: built only after every offline test passed
    # G9, packaged since 0.9.9. GitHub-hosted Windows 11 ARM64 runner; MSVC from the image (Visual Studio Build
    # Tools with the ARM64 / ARM64EC compilers). Two compilations of the same sources (native ARM64 and ARM64EC)
    # linked with /machine:arm64x into one DLL with the same exports for both halves. No signing secret here: the
    # "build" job signs the DLL together with the others. ok / sha256 are set only when every check passed.
    runs-on: windows-11-arm
    continue-on-error: true
    outputs:
      ok: ${{ steps.arm64x.outputs.ok }}
      sha256: ${{ steps.arm64x.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Build ARM64X DLL
        # 0.9.9: shared with build.yml; compiles every file (ARM64 + ARM64EC), reports MSVC errors and warnings as
        # annotations and in the job summary, links /machine:arm64x and checks the image with dumpbin (final
        # ::notice: result, machine, exports, imported DLLs, SHA-256).
        id: arm64x
        shell: pwsh
        run: ./scripts/build-arm64x.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64x
          path: WasapiDriverARM64X.dll

  package-trusted:
    # Azure Trusted Signing (G8). Runs only when the repository variable WB_SIGNING is "trusted". Signs the
    # binaries built by "build" with signtool + the Trusted Signing dlib, then rebuilds the Setup with NSIS on
    # Windows so that the uninstaller is signed too (!uninstfinalize) and signs the Setup (!finalize).
    # 0.9.9: the explicit build result is needed because "build" itself runs under !cancelled() after the
    # experimental arm64x job; the implicit success() would skip this job whenever arm64x failed.
    # The bin zip already contains the Arm64X DLL when "build" packaged it: it is signed with the other *.dll
    # files below and the Setup is rebuilt with -DARM64X=1.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.WB_SIGNING == 'trusted' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Tools (NSIS, Trusted Signing client)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          nuget install Microsoft.Trusted.Signing.Client -x -OutputDirectory tsc
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($st.FullName)" | Out-File -Append $env:GITHUB_ENV
          "DLIB=$((Resolve-Path tsc\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll).Path)" | Out-File -Append $env:GITHUB_ENV
          @{ Endpoint = '${{ vars.WB_TS_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.WB_TS_ACCOUNT }}'; CertificateProfileName = '${{ vars.WB_TS_PROFILE }}' } | ConvertTo-Json | Out-File -Encoding ascii metadata.json
      - name: Sign binaries and rebuild the Setup
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $v = '${{ needs.build.outputs.version }}'
          New-Item -ItemType Directory stage, stage\installer | Out-Null
          Expand-Archive dist\WASAPI-Driver-for-ASIO-$v-bin.zip -DestinationPath stage
          $sign = "`"$env:SIGNTOOL`" sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$env:DLIB`" /dmdf `"$PWD\metadata.json`""
          Get-ChildItem stage\*.dll, stage\*.exe | ForEach-Object { & cmd /c "$sign `"$($_.FullName)`"" ; if ($LASTEXITCODE) { exit 1 } }
          # 0.9.8: the tracing kit and its guide are in the bin zip (trace\, TRACING.txt); the Setup takes them from there
          Copy-Item installer\WasapiDriver.nsi, installer\NOTICES.txt, installer\lang_en.nsh, installer\lang_es.nsh, installer\header.bmp, installer\welcome.bmp, src\res\app.ico stage\installer\
          Push-Location stage\installer
          # 0.9.9: same Arm64X decision as the "build" job (the DLL is in the bin zip only when it was packaged)
          $a64x = if (Test-Path ..\WasapiDriverARM64X.dll) { '-DARM64X=1' } else { '-DARM64X=0' }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "-DVERSION=$v" $a64x "-DSIGN_CMD=$sign" WasapiDriver.nsi
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          Move-Item -Force stage\WASAPI-Driver-for-ASIO-$v-Setup.exe dist\
          Remove-Item dist\WASAPI-Driver-for-ASIO-$v-bin.zip
          Push-Location stage; Compress-Archive -Path *.dll, *.exe, *.txt, *.bat, trace -DestinationPath ..\dist\WASAPI-Driver-for-ASIO-$v-bin.zip; Pop-Location
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-trusted
          path: dist/*

  release:
    needs: [tests, build, arm64x, package-trusted]
    # Runs for tags when "build" succeeded; "arm64x" (experimental; without it the package has no Arm64X DLL) and
    # "package-trusted" (optional) may be failed or skipped.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.tests.result == 'success' && needs.build.result == 'success' && needs.package-trusted.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect files and checksums (no signing secrets in this job)
        run: |
          mkdir -p out
          if [ -d artifacts/release-files-trusted ]; then cp artifacts/release-files-trusted/* out/; else cp artifacts/release-files/* out/; fi
          # 0.9.9: the Arm64X DLL is inside the Setup and the bin zip (job "build"); it is no longer published as a
          # separate "experimental-unsigned" file (0.9.1, fix 11), so artifacts/arm64x is not copied.
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.build.outputs.version }}
          DOC=pkg2; [ -d pkg2 ] || DOC=.
          sed -n "/^$VERSION /,/^[0-9]\+\.[0-9]\+\.[0-9]\+ /p" $DOC/VERSION.txt | sed '$d' > notes.txt || true
          [ -s notes.txt ] || echo "WASAPI Driver for ASIO $VERSION. See VERSION.txt." > notes.txt
          # 0.9.9: say whether this package contains the Arm64X DLL (Windows on Arm)
          if [ "${{ needs.build.outputs.arm64x }}" = "true" ]; then
            printf '\nThis package contains WasapiDriverARM64X.dll (Setup and bin.zip): on Windows on Arm the Setup registers it once for native ARM64 and emulated x64 hosts. Not yet tested on real Windows on Arm hardware (KNOWN-ISSUES.txt KI-9).\n' >> notes.txt
          else
            printf '\nThis package does NOT contain the Arm64X DLL (the arm64x build failed); on Windows on Arm the Setup asks for the ARM64 or x64 DLL as in 0.9.8.\n' >> notes.txt
          fi
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "WASAPI Driver for ASIO $VERSION" --notes-file notes.txt
